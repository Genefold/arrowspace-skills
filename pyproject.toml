[project]
name = "arrowspace-skills"
version = "0.4.0"
description = "Portable skill definitions and utilities for ArrowSpace spectral vector search"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Lorenzo Moriondo", email = "tunedconsulting@gmail.com" },
]
dependencies = [
    "arrowspace>=0.24",
    "numpy",
]

[project.optional-dependencies]
tuner = ["arrowspace-tuner>=0.3"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arrowspace_skills*"]

[tool.setuptools.package-data]
arrowspace_skills = ["skills/*.md", "SKILL.md", "HYPERPARAMETERS.md"]

[project.urls]
Homepage = "https://github.com/Genefold/arrowspace-skills"
Source = "https://github.com/Genefold/arrowspace-skills"
JOSS = "https://doi.org/10.21105/joss.09002"
Tuner = "https://github.com/Genefold/arrowspace_tuner"
